# OrchidShield Security Triage & Response Recommendation Agent
# Non-secret configuration only. Secrets come from environment variables (see .env.example).
app:
  name: orchidshield-triage-agent
  version: 1.0.0
  config_version: "2026.11.16-1"
  seed: 1337
  environment: dev            # overridden by ORCHIDSHIELD_ENV

paths:                         # all relative to project root; resolved with pathlib
  logic_dir: 03_logic
  uncertainty_dir: 04_uncertainty
  ml_dir: 05_ml
  playbooks_dir: docs/playbooks
  scenarios_dir: data/scenarios
  synthetic_dir: data/synthetic
  runtime_dir: data/runtime
  results_dir: data/results

thresholds:
  critical_asset_min: 4            # criticality >= this -> Critical(h)
  ioc_min_confidence: 0.6          # indicator confidence needed for KnownBadIndicator(i)
  failed_login_burst: 5            # failures before a success -> SuccessAfterFailures(u,h)
  failed_login_window_min: 30
  impossible_travel_kmh: 900
  min_percept_quality: 0.3         # below this, percept is REJECTED
  bn_support: 0.70                 # posterior >= this counts as "sufficiently supported" (never proof)
  abstain_low: 0.35                # posterior band in which the agent abstains and asks for enrichment
  abstain_high: 0.70
  kalman_anomaly_sigma: 3.0
  fairness_max_fpr_gap: 0.10       # max FPR difference between user regions on eval data

risk_weights:                      # risk fusion weights (sum to 1)
  bayes: 0.35
  ml: 0.20
  temporal: 0.15
  criticality: 0.15
  blast_radius: 0.15

policy:
  max_isolations_per_case: 2
  disruptive_actions: [isolate_host, disable_account, block_ip, rotate_credentials]
  disruptive_requires_entailment: true
  protected_assets: [siem-01]               # never touched by automated actions (would blind the SOC)
  never_isolate_asset_types: [domain_controller]
  never_disable_account_types: [break_glass, service]
  action_costs:                              # disruption cost in utility units
    monitor: 0.0
    enrich: 0.5
    open_ticket: 0.5
    add_watchlist: 0.5
    notify_analyst: 1.0
    escalate: 2.0
    isolate_host: 6.0
    disable_account: 4.0
    block_ip: 2.0
    rotate_credentials: 3.0
  action_benefit:                            # damage averted per unit of P(compromise) * criticality
    monitor: 0.0
    enrich: 1.0
    open_ticket: 1.0
    add_watchlist: 0.8
    notify_analyst: 1.5
    escalate: 2.5
    isolate_host: 4.0
    disable_account: 3.2
    block_ip: 2.0
    rotate_credentials: 2.6

orchestrator:
  max_iterations: 4
  tool_timeout_s: 2.0
  tool_rate_limit_per_min: 60
  api_rate_limit_per_min: 120

temporal:
  bin_minutes: 15

features:                     # feature flags
  llm_narrative: false        # hosted LLM narrative (needs ANTHROPIC_API_KEY); template narrator otherwise
  rl_advisor: true            # show Q-learning advisor suggestion (advisory only, never executes)
  ml_scoring: true            # learned model in risk fusion (falls back to rules if artifact missing)
  adversarial_planner: true   # alpha-beta containment-point search

llm:
  provider: anthropic
  model: claude-opus-5-5
  max_tokens: 1200
  timeout_s: 20
  effort: low

csp:
  analysts:
    - {id: ana-1, skills: [triage, identity], senior: true}
    - {id: ana-2, skills: [triage, endpoint], senior: false}
    - {id: ana-3, skills: [endpoint, network, identity], senior: true}
  slots: [0, 1, 2, 3]          # 30-minute response slots
