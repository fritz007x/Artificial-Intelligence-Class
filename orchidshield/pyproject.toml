[project]
name = "orchidshield-triage-agent"
version = "1.0.0"
description = "OrchidShield Security Triage & Response Recommendation Agent (course capstone, synthetic data)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["e2e: end-to-end scenario tests", "slow: longer evaluation tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src"]
