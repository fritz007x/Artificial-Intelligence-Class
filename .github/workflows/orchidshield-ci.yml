name: orchidshield-ci

on:
  push:
    branches: [main]
    paths: ["orchidshield/**", ".github/workflows/orchidshield-ci.yml"]
  pull_request:
    paths: ["orchidshield/**", ".github/workflows/orchidshield-ci.yml"]

permissions:
  contents: read            # least privilege; no secrets are needed for CI

defaults:
  run:
    working-directory: orchidshield   # the project lives in a subfolder of the class repo

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: orchidshield/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Retrain (reproducibility) and evaluation gate
        run: |
          python 05_ml/train.py
          python scripts/check_eval.py
      - name: Unit, integration, safety, fairness and end-to-end tests
        run: python -m pytest -q
      - name: Execute simulation notebook
        run: |
          python scripts/build_notebook.py
          jupyter nbconvert --to notebook --execute --output /tmp/02_simulation.executed.ipynb notebooks/02_simulation.ipynb
      - name: In-process demo smoke test
        run: python scripts/demo.py > /tmp/demo.log && tail -20 /tmp/demo.log

  windows:
    # Windows defaults to cp1252 for text files; this job catches missing encoding="utf-8".
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: orchidshield/requirements-dev.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Retrain and evaluation gate
        run: |
          python 05_ml/train.py
          python scripts/check_eval.py
      - name: Tests
        run: python -m pytest -q
      - name: Demo smoke test
        run: python scripts/demo.py

  container:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t orchidshield:${{ github.sha }} .
      - name: Run container and probe health
        env:
          OP: ci-operator-${{ github.run_id }}
        run: |
          docker run -d --name os -p 8000:8000 \
            -e ORCHIDSHIELD_OPERATOR_KEY="$OP" -e ORCHIDSHIELD_APPROVER_KEY="ap-$OP" -e ORCHIDSHIELD_ADMIN_KEY="ad-$OP" \
            orchidshield:${{ github.sha }}
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          curl -fsS -X POST -H "X-API-Key: $OP" localhost:8000/api/scenarios/constraint/run | python -c "import json,sys; c=json.load(sys.stdin); assert any(p['status']=='blocked' for p in c['proposals'])"
          test "$(docker inspect --format '{{.State.Health.Status}}' os)" != "unhealthy"
      - name: Logs on failure
        if: failure()
        run: docker logs os
